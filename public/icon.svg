<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="4"/>
  
  <!-- LED Diode Grid Array (Simulating Fine Pitch LED Cabinet) -->
  <g opacity="0.85">
    <!-- LED Matrix Cells -->
    <rect x="76" y="76" width="360" height="240" rx="20" fill="url(#chipGrad)" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 4"/>
    
    <!-- Discrete LED Subpixels -->
    <!-- Row 1 -->
    <circle cx="116" cy="116" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="140" cy="116" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="164" cy="116" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="212" cy="116" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="236" cy="116" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="260" cy="116" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="308" cy="116" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="332" cy="116" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="356" cy="116" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="400" cy="116" r="8" fill="#38bdf8"/>

    <!-- Row 2 -->
    <circle cx="116" cy="160" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="140" cy="160" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="164" cy="160" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="212" cy="160" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="236" cy="160" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="260" cy="160" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="308" cy="160" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="332" cy="160" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="356" cy="160" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="400" cy="160" r="8" fill="#38bdf8"/>

    <!-- Row 3 -->
    <circle cx="116" cy="204" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="140" cy="204" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="164" cy="204" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="212" cy="204" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="236" cy="204" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="260" cy="204" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="308" cy="204" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="332" cy="204" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="356" cy="204" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="400" cy="204" r="8" fill="#38bdf8"/>

    <!-- Row 4 -->
    <circle cx="116" cy="248" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="140" cy="248" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="164" cy="248" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="212" cy="248" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="236" cy="248" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="260" cy="248" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="308" cy="248" r="10" fill="#ef4444" opacity="0.9"/>
    <circle cx="332" cy="248" r="10" fill="#22c55e" opacity="0.9"/>
    <circle cx="356" cy="248" r="10" fill="#3b82f6" opacity="0.9"/>
    
    <circle cx="400" cy="248" r="8" fill="#38bdf8"/>
  </g>

  <!-- High-Speed Transmission & Processor Core Overlay -->
  <g>
    <!-- Center Processor Badge -->
    <rect x="146" y="320" width="220" height="110" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="4"/>
    <!-- Heat sink lines -->
    <line x1="166" y1="340" x2="166" y2="410" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="186" y1="340" x2="186" y2="410" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="326" y1="340" x2="326" y2="410" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="346" y1="340" x2="346" y2="410" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    
    <!-- NovaStar / COEX 5G Emblem Text -->
    <text x="256" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">NOVASTAR</text>
    <text x="256" y="395" font-family="monospace" font-size="14" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">COEX &amp; MLED 8K</text>
    <circle cx="256" cy="412" r="4" fill="#22c55e"/>
  </g>

  <!-- High speed data bus connections -->
  <path d="M 176 320 L 176 290 L 256 290" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 336 320 L 336 290 L 256 290" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="290" r="5" fill="#38bdf8"/>
</svg>
